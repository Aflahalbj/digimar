<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - DIECASTKU</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: url(/assets/auth-bg.webp) center/cover no-repeat;
      background-attachment: fixed;
      margin: 0;
      position: relative;
      padding: 20px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(3, 5, 8, 0.6) 0%, rgba(3, 5, 8, 0.85) 100%);
      z-index: 1;
    }

    .auth-container {
      position: relative;
      z-index: 2;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0));
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      /* animation: float 6s ease-in-out infinite; */
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    .auth-logo {
      text-align: center;
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 30px;
      letter-spacing: 3px;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.95);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.25);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 12px;
      font-family: var(--font-main);
      transition: all 0.3s ease;
      outline: none;
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .form-control:focus {
      border-color: var(--primary);
      background: rgba(249, 115, 22, 0.05);
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.3);
      transform: translateY(-2px);
    }

    .btn-auth {
      width: 100%;
      margin-top: 10px;
      justify-content: center;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
    }

    .btn-auth:hover {
      box-shadow: 0 8px 25px rgba(249, 115, 22, 0.6);
    }

    .auth-switch {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
    }

    .auth-switch a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .auth-switch a:hover {
      color: #ff9d4d;
      text-decoration: underline;
      text-shadow: 0 0 10px rgba(249, 115, 22, 0.6);
    }

    .forgot-pw {
      display: block;
      text-align: right;
      font-size: 0.85rem;
      margin-top: -10px;
      margin-bottom: 20px;
    }

    .alert {
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 24px;
      display: none;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.2);
      color: #ffb3b3;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.2);
      color: #b3ffb3;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
  </style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FYDW6Z25BF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-FYDW6Z25BF');
  </script>
</head>

<body>

  <div class="auth-container">
    <div class="auth-logo">
      <a href="index.html" style="color: inherit; text-decoration: none;">
        <span class="logo-icon"><i class="fas fa-explosion"></i></span>
        <span class="logo-text">DIECAST<span class="logo-accent">KU</span></span>
      </a>
    </div>

    <!-- REGISTER FORM (DEFAULT) -->
    <div id="registerSection">
      <div id="registerAlert" class="alert"></div>
      <form id="registerForm">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="registerName" class="form-control" placeholder="Masukkan nama lengkap" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="registerEmail" class="form-control" placeholder="Masukkan email aktif" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="registerPassword" class="form-control"
            placeholder="Buat password minimal 6 karakter" required minlength="6">
        </div>
        <div class="form-group">
          <label>Konfirmasi Password</label>
          <input type="password" id="registerConfirmPassword" class="form-control" placeholder="Ulangi password di atas"
            required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-auth">Daftar Sekarang</button>
      </form>
      <div class="auth-switch">
        Sudah punya akun? <a href="#" id="showLogin">Masuk disini</a>
      </div>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginSection" style="display: none;">
      <div id="loginAlert" class="alert"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="Masukkan email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Masukkan password" required>
        </div>
        <div class="auth-switch forgot-pw">
          <a href="#" id="forgotPwLink">Lupa password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-auth">Masuk</button>
      </form>
      <div class="auth-switch">
        Belum punya akun? <a href="#" id="showRegister">Daftar di sini</a>
      </div>
    </div>

  </div>
  
  <script>
    const API_URL = '/api';

    // Toggle forms
    document.getElementById('showLogin').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('registerSection').style.display = 'none';
      document.getElementById('loginSection').style.display = 'block';
    });
    document.getElementById('showRegister').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('registerSection').style.display = 'block';
    });

    function showAlert(type, section, message) {
      const el = document.getElementById(section + 'Alert');
      el.className = 'alert alert-' + type;
      el.textContent = message;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 3000);
    }

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const btn = e.target.querySelector('button');
      btn.textContent = 'Memuat...';

      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = 'index.html';
        } else {
          showAlert('error', 'login', data.error);
        }
      } catch (err) {
        showAlert('error', 'login', 'Gagal terhubung ke server. Pastikan server API menyala.');
      } finally {
        btn.textContent = 'Masuk';
      }
    });

    // Register
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('registerName').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      const confirmPassword = document.getElementById('registerConfirmPassword').value;

      if (password !== confirmPassword) {
        showAlert('error', 'register', 'Password dan Konfirmasi Password tidak cocok!');
        return;
      }

      const btn = e.target.querySelector('button');
      btn.textContent = 'Memuat...';

      try {
        const res = await fetch(`${API_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();

        if (res.ok) {
          showAlert('success', 'login', 'Akun berhasil dibuat! Silakan masuk.');
          document.getElementById('showLogin').click();
          document.getElementById('registerForm').reset();
        } else {
          showAlert('error', 'register', data.error);
        }
      } catch (err) {
        showAlert('error', 'register', 'Gagal terhubung ke server. Pastikan server API menyala.');
      } finally {
        btn.textContent = 'Daftar Sekarang';
      }
    });
  

    // ─── LUPA PASSWORD ────────────────────────────────
    document.getElementById('forgotPwLink').addEventListener('click', e => {
      e.preventDefault();
      // Buat modal lupa password
      const existing = document.getElementById('forgotOverlay');
      if (existing) { existing.style.display = 'flex'; return; }

      const overlay = document.createElement('div');
      overlay.id = 'forgotOverlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
      overlay.innerHTML = `
        <div style="background:#0d1117;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:32px;width:100%;max-width:400px;font-family:'Outfit',sans-serif;color:#f8fafc">
          <h3 style="font-family:'Rajdhani',sans-serif;font-size:1.3rem;font-weight:700;margin-bottom:6px">🔑 Lupa Password</h3>
          <p style="font-size:.85rem;color:#94a3b8;margin-bottom:20px">Masukkan email kamu, kami akan kirimkan link reset password.</p>
          <input type="email" id="forgotEmail" placeholder="email@kamu.com" style="width:100%;background:rgba(0,0,0,0.3);border:1.5px solid rgba(255,255,255,0.1);color:#f8fafc;padding:12px 14px;border-radius:10px;font-family:'Outfit',sans-serif;font-size:.9rem;outline:none;margin-bottom:14px;box-sizing:border-box">
          <div id="forgotMsg" style="font-size:.82rem;margin-bottom:12px;min-height:18px"></div>
          <div style="display:flex;gap:10px">
            <button id="forgotCancel" style="flex:1;padding:11px;background:none;border:1.5px solid rgba(255,255,255,0.1);color:#94a3b8;border-radius:10px;cursor:pointer;font-family:'Outfit',sans-serif;font-weight:600">Batal</button>
            <button id="forgotSubmit" style="flex:2;padding:11px;background:linear-gradient(135deg,#f97316,#ea580c);border:none;color:#fff;border-radius:10px;cursor:pointer;font-family:'Outfit',sans-serif;font-weight:700">Kirim Link Reset</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      document.getElementById('forgotCancel').addEventListener('click', () => overlay.style.display = 'none');
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.style.display = 'none'; });

      document.getElementById('forgotSubmit').addEventListener('click', async () => {
        const email = document.getElementById('forgotEmail').value.trim();
        const msgEl = document.getElementById('forgotMsg');
        const btn = document.getElementById('forgotSubmit');
        if (!email) { msgEl.style.color = '#ef4444'; msgEl.textContent = 'Email wajib diisi.'; return; }
        btn.disabled = true; btn.textContent = 'Mengirim...';
        try {
          const res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
          });
          const data = await res.json();
          msgEl.style.color = '#22c55e';
          msgEl.textContent = data.message || 'Link reset telah dikirim ke email kamu!';
          btn.textContent = '✓ Terkirim';
        } catch (err) {
          msgEl.style.color = '#ef4444';
          msgEl.textContent = 'Gagal mengirim. Coba lagi.';
          btn.disabled = false; btn.textContent = 'Kirim Link Reset';
        }
      });
    });
</script>
</body>

</html>
