<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – Diecastku</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Rajdhani:wght@700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#050810;color:#f8fafc;font-family:'Outfit',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:60px 60px}
    .card{background:#0d1117;border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 20px 80px rgba(0,0,0,.5),0 0 40px rgba(249,115,22,.06)}
    .logo{font-family:'Rajdhani',sans-serif;font-size:1.8rem;font-weight:800;letter-spacing:3px;text-align:center;margin-bottom:6px}
    .logo span{color:#f97316}
    .subtitle{text-align:center;color:#64748b;font-size:.85rem;margin-bottom:28px}
    label{display:block;font-size:.82rem;font-weight:600;color:#94a3b8;margin-bottom:6px}
    input{width:100%;background:rgba(0,0,0,.3);border:1.5px solid rgba(255,255,255,.08);color:#f8fafc;padding:12px 14px;border-radius:10px;font-family:'Outfit',sans-serif;font-size:.9rem;outline:none;transition:.25s;margin-bottom:14px}
    input:focus{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.1)}
    .btn{width:100%;padding:13px;background:linear-gradient(135deg,#f97316,#ea580c);border:none;color:#fff;border-radius:10px;font-family:'Outfit',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:.25s;box-shadow:0 4px 20px rgba(249,115,22,.4)}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(249,115,22,.6)}
    .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .msg{font-size:.85rem;text-align:center;margin-top:12px;min-height:20px}
    .msg.ok{color:#22c55e}
    .msg.err{color:#ef4444}
    .back{display:block;text-align:center;margin-top:16px;color:#94a3b8;font-size:.85rem;text-decoration:none;transition:.2s}
    .back:hover{color:#f97316}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">DIECAST<span>KU</span></div>
    <div class="subtitle">Buat password baru untuk akunmu</div>
    <div id="formWrap">
      <label>Password Baru</label>
      <input type="password" id="newPass" placeholder="Minimal 6 karakter" />
      <label>Konfirmasi Password</label>
      <input type="password" id="confirmPass" placeholder="Ulangi password baru" />
      <button class="btn" id="resetBtn">Reset Password</button>
      <div class="msg" id="msg"></div>
    </div>
    <a href="login.html" class="back">← Kembali ke Login</a>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const msgEl = document.getElementById('msg');

    if (!token) {
      msgEl.className = 'msg err';
      msgEl.textContent = 'Link tidak valid. Minta link reset baru dari halaman login.';
      document.getElementById('formWrap').style.display = 'none';
    }

    document.getElementById('resetBtn').addEventListener('click', async () => {
      const pass = document.getElementById('newPass').value;
      const confirm = document.getElementById('confirmPass').value;
      const btn = document.getElementById('resetBtn');

      if (!pass || pass.length < 6) {
        msgEl.className = 'msg err'; msgEl.textContent = 'Password minimal 6 karakter.'; return;
      }
      if (pass !== confirm) {
        msgEl.className = 'msg err'; msgEl.textContent = 'Password tidak cocok.'; return;
      }

      btn.disabled = true; btn.textContent = 'Menyimpan...';
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: pass }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Gagal');
        msgEl.className = 'msg ok';
        msgEl.textContent = '✓ Password berhasil direset! Mengarahkan ke login...';
        document.getElementById('formWrap').style.opacity = '.5';
        document.getElementById('formWrap').style.pointerEvents = 'none';
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      } catch (err) {
        msgEl.className = 'msg err';
        msgEl.textContent = err.message;
        btn.disabled = false; btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
