<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - DIECAST INDONESIA</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: url(https://images-luxe.outlookindia.com/2024/06/12070940/nikhil_car_5_20240612.jpg) center/cover no-repeat;
      background-attachment: fixed;
      margin: 0;
      position: relative;
      padding: 20px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(3, 5, 8, 0.6) 0%, rgba(3, 5, 8, 0.85) 100%);
      z-index: 1;
    }

    .auth-container {
      position: relative;
      z-index: 2;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0));
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      /* animation: float 6s ease-in-out infinite; */
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    .auth-logo {
      text-align: center;
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 30px;
      letter-spacing: 3px;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.95);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.25);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 12px;
      font-family: var(--font-main);
      transition: all 0.3s ease;
      outline: none;
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .form-control:focus {
      border-color: var(--primary);
      background: rgba(249, 115, 22, 0.05);
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.3);
      transform: translateY(-2px);
    }

    .btn-auth {
      width: 100%;
      margin-top: 10px;
      justify-content: center;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
    }

    .btn-auth:hover {
      box-shadow: 0 8px 25px rgba(249, 115, 22, 0.6);
    }

    .auth-switch {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
    }

    .auth-switch a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .auth-switch a:hover {
      color: #ff9d4d;
      text-decoration: underline;
      text-shadow: 0 0 10px rgba(249, 115, 22, 0.6);
    }

    .forgot-pw {
      display: block;
      text-align: right;
      font-size: 0.85rem;
      margin-top: -10px;
      margin-bottom: 20px;
    }

    .alert {
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 24px;
      display: none;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.2);
      color: #ffb3b3;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.2);
      color: #b3ffb3;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
  </style>
</head>

<body>

  <div class="auth-container">
    <div class="auth-logo">
      <a href="index.html" style="color: inherit; text-decoration: none;">
        <span class="logo-icon"><i class="fas fa-explosion"></i></span>
        <span class="logo-text">DIE<span class="logo-accent">CAST</span></span>
      </a>
    </div>

    <!-- REGISTER FORM (DEFAULT) -->
    <div id="registerSection">
      <div id="registerAlert" class="alert"></div>
      <form id="registerForm">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="registerName" class="form-control" placeholder="Masukkan nama lengkap" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="registerEmail" class="form-control" placeholder="Masukkan email aktif" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="registerPassword" class="form-control"
            placeholder="Buat password minimal 6 karakter" required minlength="6">
        </div>
        <div class="form-group">
          <label>Konfirmasi Password</label>
          <input type="password" id="registerConfirmPassword" class="form-control" placeholder="Ulangi password di atas"
            required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-auth">Daftar Sekarang</button>
      </form>
      <div class="auth-switch">
        Sudah punya akun? <a href="#" id="showLogin">Masuk disini</a>
      </div>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginSection" style="display: none;">
      <div id="loginAlert" class="alert"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="Masukkan email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Masukkan password" required>
        </div>
        <div class="auth-switch forgot-pw">
          <a href="#" onclick="alert('Silakan hubungi admin via WhatsApp untuk reset password: +6283138991304')">Lupa
            password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-auth">Masuk</button>
      </form>
      <div class="auth-switch">
        Belum punya akun? <a href="#" id="showRegister">Daftar di sini</a>
      </div>
    </div>

  </div>

  <script>
    const API_URL = '/api';

    // Toggle forms
    document.getElementById('showLogin').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('registerSection').style.display = 'none';
      document.getElementById('loginSection').style.display = 'block';
    });
    document.getElementById('showRegister').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('registerSection').style.display = 'block';
    });

    function showAlert(type, section, message) {
      const el = document.getElementById(section + 'Alert');
      el.className = 'alert alert-' + type;
      el.textContent = message;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 3000);
    }

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const btn = e.target.querySelector('button');
      btn.textContent = 'Memuat...';

      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = 'index.html';
        } else {
          showAlert('error', 'login', data.error);
        }
      } catch (err) {
        showAlert('error', 'login', 'Gagal terhubung ke server. Pastikan server API menyala.');
      } finally {
        btn.textContent = 'Masuk';
      }
    });

    // Register
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('registerName').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      const confirmPassword = document.getElementById('registerConfirmPassword').value;

      if (password !== confirmPassword) {
        showAlert('error', 'register', 'Password dan Konfirmasi Password tidak cocok!');
        return;
      }

      const btn = e.target.querySelector('button');
      btn.textContent = 'Memuat...';

      try {
        const res = await fetch(`${API_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();

        if (res.ok) {
          showAlert('success', 'login', 'Akun berhasil dibuat! Silakan masuk.');
          document.getElementById('showLogin').click();
          document.getElementById('registerForm').reset();
        } else {
          showAlert('error', 'register', data.error);
        }
      } catch (err) {
        showAlert('error', 'register', 'Gagal terhubung ke server. Pastikan server API menyala.');
      } finally {
        btn.textContent = 'Daftar Sekarang';
      }
    });
  </script>
</body>

</html>
